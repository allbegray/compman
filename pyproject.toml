[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "compman"
version = "1.6.2"
description = "Docker Compose stack management CLI"
readme = "README.md"
license = "MIT"
authors = [{ name = "allbegray" }]
keywords = ["docker", "compose", "podman", "cli", "devops", "backup", "deploy"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
dependencies = ["typer>=0.12.0", "pyyaml>=6.0", "boto3>=1.28.0", "botocore>=1.31.0"]

[project.urls]
Homepage = "https://allbegray.github.io/compman/"
Repository = "https://github.com/allbegray/compman"
Changelog = "https://github.com/allbegray/compman/blob/main/CHANGELOG.md"

[project.scripts]
compman = "compman.cli:app"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["compman*"]

[dependency-groups]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "ruff>=0.9.0", "mypy>=1.13.0"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: drives a real container runtime; deselected by default, run with -m integration",
]
addopts = "-ra --strict-markers -m 'not integration'"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["compman"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
