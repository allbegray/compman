[project]
name = "compman"
version = "1.5.0"
description = "Docker Compose stack management CLI"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["typer>=0.12.0", "pyyaml>=6.0", "boto3>=1.28.0", "botocore>=1.31.0"]

[project.scripts]
compman = "compman.cli:app"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["compman*"]

[dependency-groups]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "ruff>=0.9.0", "mypy>=1.13.0"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["compman"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
