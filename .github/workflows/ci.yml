name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --dev
      - run: uv run pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - run: uv sync --dev
      - run: uv run ruff check compman tests
      - run: uv run mypy compman
      - name: Enforce 100% coverage
        run: uv run pytest --cov=compman --cov-report=term-missing

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - run: uv build --wheel --out-dir "$RUNNER_TEMP/compman-dist"
      - run: python -m venv "$RUNNER_TEMP/compman-venv"
      - run: uv pip install --python "$RUNNER_TEMP/compman-venv/bin/python" "$RUNNER_TEMP/compman-dist"/*.whl
      - run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/compman-venv/bin/compman" --help
          "$RUNNER_TEMP/compman-venv/bin/compman" version
          "$RUNNER_TEMP/compman-venv/bin/compman" init --scaffold
          "$RUNNER_TEMP/compman-venv/bin/compman" --lang ko --help
          "$RUNNER_TEMP/compman-venv/bin/compman" completion bash

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
      - run: uv sync --dev
      - run: docker compose up -d
      - name: Wait for Ministack
        run: |
          ready=0
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:4566/deploy-test/Dockerfile >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
      - name: Run integration tests
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: ap-northeast-2
          AWS_ENDPOINT_URL_S3: http://localhost:4566
        run: uv run pytest -m integration -ra
      - name: Deploy and run stack
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: ap-northeast-2
          AWS_ENDPOINT_URL_S3: http://localhost:4566
        run: |
          target="$RUNNER_TEMP/compman-e2e"
          mkdir -p "$target"
          cd "$target"
          uv run --project "$GITHUB_WORKSPACE" compman deploy --path s3://deploy-test --build --tag compman-e2e
          uv run --project "$GITHUB_WORKSPACE" compman stack up
          uv run --project "$GITHUB_WORKSPACE" compman service status
          uv run --project "$GITHUB_WORKSPACE" compman stack down --yes
      - if: always()
        run: docker compose down -v
